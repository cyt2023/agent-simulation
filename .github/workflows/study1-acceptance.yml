name: Study 1 Acceptance

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "media_service/**"
      - "scripts/**"
      - "tests/acceptance/**"
      - "release/**"
      - "docs/study1-**"
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend and media dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -e media_service

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build release manifest
        run: |
          python scripts/build_study1_release_manifest.py \
            --output release/study1-release-manifest.json \
            --backend-build "$GITHUB_SHA" \
            --frontend-build "$GITHUB_SHA" \
            --media-build "$GITHUB_SHA"

      - name: Verify release manifest
        run: python scripts/verify_study1_release.py release/study1-release-manifest.json

      - name: Backend Study 1 tests
        run: python -m pytest -p no:cacheprovider backend/tests/study1 -q

      - name: Media service tests
        run: python -m pytest -p no:cacheprovider media_service/tests -q

      - name: Acceptance reconstruction tests
        run: python -m pytest -p no:cacheprovider tests/acceptance -q

      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Frontend build
        working-directory: frontend
        run: npm run build
