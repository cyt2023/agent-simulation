# Full stack: local Postgres + backend + frontend.
# Copy .env.example -> .env and set OPENAI_API_KEY (or other LLM keys), POSTGRES_PASSWORD, etc.
#
# Use external DB only (e.g. RDS): docker compose -f docker-compose.rds.yml --env-file .env up --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: humanagent-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-humanagent}
      MEDIA_DATABASE_PASSWORD: ${MEDIA_DATABASE_PASSWORD:?MEDIA_DATABASE_PASSWORD is required}
    # Bind to loopback only: backend still uses hostname `postgres` on the Docker network.
    # Publishing to 127.0.0.1 allows `ssh -L LOCAL:127.0.0.1:5432` for local psql/export without exposing 5432 on the instance's public interface.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/docker-init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/docker-init-media.sh:/docker-entrypoint-initdb.d/02-media-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-humanagent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: humanagent-backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      # Default URL targets the bundled `postgres` service. Set DATABASE_URL in `.env` to use RDS instead.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:changeme@postgres:5432/humanagent}
      PGSCHEMA: ${PGSCHEMA:-humanagent_collab}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-change-me-in-production}
      MEDIA_GATEWAY_MODE: http
      MEDIA_SERVICE_URL: http://media-service:8000
      A_TO_B_SERVICE_TOKEN: ${A_TO_B_SERVICE_TOKEN:?A_TO_B_SERVICE_TOKEN is required}
      # LLM / Azure / AWS: set via env_file (`.env`, `backend/.env`) only.
      # Do not list them here — Compose `environment` overrides `env_file`, and
      # `${VAR:-}` is resolved from the project root `.env` only, so values in
      # `backend/.env` would be wiped (e.g. LLM stuck on mock).
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads
      # export_session_data default --output-dir is /app/exports; mount so JSON appears on the host.
      - ./backend/exports:/app/exports
    depends_on:
      postgres:
        condition: service_healthy
      media-service:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.9.6
    container_name: study1-livekit
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}"
    ports:
      - "${LIVEKIT_HTTP_PORT:-7880}:7880"
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    healthcheck:
      test: ["CMD", "livekit-server", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  media-service:
    build:
      context: .
      dockerfile: media_service/Dockerfile
    container_name: study1-media-service
    env_file:
      - path: .env
        required: false
    environment:
      MEDIA_DATABASE_URL: postgresql+psycopg://study1_media:${MEDIA_DATABASE_PASSWORD:?MEDIA_DATABASE_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-humanagent}
      MEDIA_DATABASE_SCHEMA: study1_media
      A_TO_B_SERVICE_TOKEN: ${A_TO_B_SERVICE_TOKEN:?A_TO_B_SERVICE_TOKEN is required}
      STUDY1_INTERNAL_API_KEY: ${STUDY1_INTERNAL_API_KEY:?STUDY1_INTERNAL_API_KEY is required}
      A_BASE_URL: http://backend:5000
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      MEDIA_PROVIDER: ${MEDIA_PROVIDER:-mock}
    volumes:
      - study1_media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: humanagent-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  study1_media_data:
    driver: local
